<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/ico" href="../assets/favicon.ico"/>
    <title>Contact JMA</title>
    <link rel="stylesheet" href="../index.css">
    <link rel="stylesheet" href="https://use.typekit.net/wyw1mwv.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <style>
        .align-logo {
            transform: translateY(11px);
        }
        .form-section {
            display: flex;
            gap: 2rem; /* Gap between the left and right sections */
        }
        .left-section {
            flex: 1;
        }
        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .right-section > .content {
            flex-grow: 1;
        }
        .send-message-container {
            margin-top: auto;
        }
        .success-message {
            color: white;
            font-size: 1.2em;
            margin-top: 1em;
        }
        .error-message {
            color: red;
            font-size: 1.2em;
            margin-top: 1em;
        }
        @media screen and (max-width: 1024px) {
    .burger {
        display: block;
        height: 32px;
    }
    .nav {
        margin: 0;
        position: absolute;
        top: -500%; /* Start off-screen above */
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-around;
        padding: 0;
        transition: all 400ms;
    }
    .navlink {
        text-align: left;
        border-bottom: 1px solid; /* White borders around links */
        padding: 10px; /* Padding for better touch area */
        font-size: 18px; /* Larger font size */
    }

    .nav-active {
        top: 80px;
    }
}
    </style>
</head>
<body class="bg-dark">
    <div id="navbar"></div>
    <div class="overlay"></div>
    <header class="bg-dark z-50 w-full h-[80px] flex items-center justify-around fixed text-white lg:hidden">
      <div class="flex justify-start items-center">
          <a href="./../../index.html" class="block translate-y-1 absolute top-4 left-10 items-center">
            <img src="./../assets/jma_logo.png" class="h-12 mx-auto md:mx-0"/>
          </a>
        </div>
      <ul class="nav bg-dark">
          <li class="navlink"><a href="./../index.html">Home</a></li>
          <li class="navlink"><a href="WhoWeAre.html">Who we are</a></li>
          <li class="navlink"><a href="WhatWeDo.html">What we do</a></li>
          <li class="navlink"><a href="OurProcess.html">Our process</a></li>
          <li class="navlink"><a href="OurWork.html">Our work</a></li>
          <li class="navlink"><a href="https://www.jmaonlinestore.com/" target="_blank" rel="noopener noreferrer">Shop online</a></li>
          <li class="navlink"><a href="Contact.html">Contact</a></li>
      </ul>
      <div class="burger">
          <i class="fas fa-bars text-2xl"></i>
      </div>
  </header>
    <div id="background-images"></div>

    <!-- FORM -->
    <div class="pt-48 flex mx-10 lg:mx-28">
        <div class="hidden text-4xl text-white font-man lg:flex font-semibold items-center mb-10 lg:mb-20">
            Start a new project with
            <img src="./../assets/jma_logo.png" alt="JMA" class="hidden lg:flex px-2 align-logo h-12"/>
        </div>
        <div class="lg:hidden text-4xl text-white font-man flex font-semibold items-center mb-10 lg:mb-20">
            Start a new project with JMA
        </div>
    </div>
    <div class="grid grid-col-1 lg:grid-cols-2 mx-10 lg:mx-28 pt-14 form-section">
        <!-- Left section for form fields -->
        <div class="left-section">
            <form class="lg:w-3/4 space-y-4" id="contactForm" action="https://formspree.io/f/xgvwvrod" method="POST">
                <input type="text" name="name" placeholder="Your name*" required class="w-full px-3 py-2 border-gl border-b bg-dark font-manrope text-white rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <input type="email" name="email" placeholder="Your email*" required class="w-full px-3 py-2 border-gl border-b bg-dark font-manrope text-white rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <input type="text" name="company" placeholder="Your Company" required class="w-full px-3 py-2 border-gl border-b bg-dark font-manrope text-white rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                <div class="py-3">
                    <textarea name="message" rows="5" placeholder="Tell us about your project*" required class="w-full px-3 bg-dark py-2 border-gl font-manrope text-white border rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <input type="hidden" name="selectedInterests" id="selectedInterests" value="">
                <input type="text" name="_gotcha" style="display:none">
            </form>
        </div>

        <!-- Right section for options and send button -->
        <div class="right-section">
            <div class="content hidden lg:flex">
                <p class="text-xl mb-4 text-white font-manrope">I'm interested in...</p>
                <div class="space-y-2">
                    <div class="flex flex-row space-x-2">
                        <!-- Buttons -->
                        <button type="button" data-value="Apparel" class="option-button rounded-full px-4 py-2 border-2 font-manrope text-white border-gl opacity-100">Apparel</button>
                        <button type="button" data-value="Gifting" class="option-button rounded-full px-4 py-2 border-2 font-manrope text-white border-gl opacity-100">Gifting</button>
                        <button type="button" data-value="Event marketing" class="option-button rounded-full px-4 py-2 border-2 font-manrope text-white border-gl opacity-100">Event marketing</button>
                    </div>
                    <div class="flex flex-row space-x-2">
                        <button type="button" data-value="Retail brands" class="option-button rounded-full px-4 py-2 border-2 font-manrope text-white border-gl opacity-100">Retail brands</button>
                        <button type="button" data-value="Inventory management" class="option-button rounded-full px-4 py-2 border-2 font-manrope text-white border-gl opacity-100">Inventory management</button>
                        <button type="button" data-value="Shipping solutions" class="option-button rounded-full px-4 py-2 border-2 font-manrope text-white border-gl opacity-100">Shipping solutions</button>
                    </div>
                </div>
            </div>

            <!-- Send message button -->
            <div class="send-message-container">
                <button type="submit" form="contactForm" id="submitButton" class="mt-auto pb-3 flex items-center">
                    <div class="px-2 text-blue text-3xl font-medium font-manrope">Send message</div>
                    <i class="fas fa-arrow-right pl-2 text-blue text-3xl align-middle"></i>
                </button>
            </div>

            <div id="message" class="success-message" style="display:none;">Thank you! Your message has been sent.</div>
            <div id="error" class="error-message" style="display:none;">Oops! Something went wrong. Please try again.</div>
        </div>
    </div>
    <div id="footer" class="-mt-40 lg:-mt-0"></div>

    <script>

    // MOBILENAVIGATION -------------------------------------------------------------------------------------------------------------------------------------------------------------------------
const burger = document.querySelector('.burger i');
const nav = document.querySelector('.nav');
const overlay = document.querySelector('.overlay');

// Defining a function
function toggleNav() {
    burger.classList.toggle('fa-bars');
    burger.classList.toggle('fa-times');
    nav.classList.toggle('nav-active');
    overlay.style.display = nav.classList.contains('nav-active') ? 'block' : 'none';
}

// Calling the function after click event occurs
burger.addEventListener('click', function() {
    toggleNav();
});     

// Close the nav when clicking on the overlay
overlay.addEventListener('click', function() {
    toggleNav();
});

// MOBILENAVIGATION -----------------------------------------------------------------

    document.addEventListener("DOMContentLoaded", function() {
        const form = document.getElementById('contactForm');
        const submitButton = document.getElementById('submitButton');
        const message = document.getElementById('message');
        const error = document.getElementById('error');
        const buttons = document.querySelectorAll('.option-button');
        const selectedInterests = [];

        buttons.forEach(button => {
            button.addEventListener('click', function() {
                const value = this.getAttribute('data-value');
                if (selectedInterests.includes(value)) {
                    const index = selectedInterests.indexOf(value);
                    selectedInterests.splice(index, 1);
                    this.classList.remove('bg-white', 'text-black');
                    this.classList.add('text-white', 'bg-transparent');
                } else {
                    selectedInterests.push(value);
                    this.classList.add('bg-white', 'text-black');
                    this.classList.remove('text-white', 'bg-transparent');
                }

                document.getElementById('selectedInterests').value = selectedInterests.join(', ');
            });
        });

        form.addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent the default form submission

            const formData = new FormData(form);

            fetch('https://formspree.io/f/xgvwvrod', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }).then(response => {
                if (response.ok) {
                    message.style.display = 'block';
                    form.reset();
                    selectedInterests.length = 0; // Clear the selected interests
                    buttons.forEach(button => {
                        button.classList.remove('bg-white', 'text-black');
                        button.classList.add('text-white', 'bg-transparent');
                    });
                } else {
                    response.json().then(data => {
                        if (Object.hasOwn(data, 'errors')) {
                            error.innerText = data['errors'].map(error => error['message']).join(', ');
                        } else {
                            error.innerText = 'Oops! Something went wrong. Please try again.';
                        }
                        error.style.display = 'block';
                    });
                }
            }).catch(error => {
                console.error('Error:', error);
                error.innerText = 'Oops! Something went wrong. Please try again.';
                error.style.display = 'block';
            });
        });
    });

    // Navbar hide on scroll down, show on scroll up
    let lastScrollTop = 0;
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', function() {
        let currentScroll = window.pageYOffset || document.documentElement.scrollTop;

        if (currentScroll > lastScrollTop) {
            // Scrolling down
            navbar.style.top = '-130px'; // Adjust this value based on your navbar's height
        } else {
            // Scrolling up or stopped
            navbar.style.top = '0';
        }

        lastScrollTop = currentScroll <= 0 ? 0 : currentScroll; // For Mobile or negative scrolling
    }, false);

    document.addEventListener('DOMContentLoaded', function() {
        fetch('../components/navbar.html')
            .then(response => response.text())
            .then(html => document.getElementById('navbar').innerHTML = html);
    });

    document.addEventListener('DOMContentLoaded', function() {
        fetch('../components/footer.html')
            .then(response => response.text())
            .then(html => document.getElementById('footer').innerHTML = html);
    });

    // JavaScript for button toggle behavior
    document.querySelectorAll('.option-button').forEach(button => {
        button.addEventListener('click', function() {
            this.classList.toggle('bg-blue');
            this.classList.toggle('opacity-100');
            this.classList.toggle('border-blue');
        });
    });

    document.addEventListener('DOMContentLoaded', function() {
        fetch('../components/bg.html')
            .then(response => response.text())
            .then(html => document.getElementById('background-images').innerHTML = html);
    });
    </script>
</body>
</html>
