<html lang="en">

    <meta charset="UTF-8" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <!-- Interstate font from personal adobe account, change to JMA account -->

    <style>

@media screen and (max-width: 1024px) {
    .burger {
        display: block;
        height: 32px;
    }
    .nav {
        margin: 0;
        position: absolute;
        right: -100%;
        width: 50%;
        height: calc(100% - 70px);
        flex-direction: column;
        justify-content: space-around;
        padding: 0;
        transition: all 400ms;
    }
    .navlink {
        text-align: center;
    }

    .nav-active {
        right: 0;
    }
}
    </style>
  </head>
  <body>
    <header class="bg-dark z-50 w-full h-[80px] flex items-center justify-around fixed text-white">
        <div class="flex justify-start items-center">
            <a href="./../../index.html" class="block translate-y-1.5 absolute top-4 left-10 items-center">
              <img src="./../assets/jma_logo.png" class="h-12 mx-auto md:mx-0"/>
            </a>
          </div>
        <ul class="nav">
            <li class="navlink"><a href="#">Home</a></li>
            <li class="navlink"><a href="#">About</a></li>
            <li class="navlink"><a href="#">Projects</a></li>
            <li class="navlink"><a href="#">Contact</a></li>
        </ul>
        <div class="burger">
            <i class="fas fa-bars"></i>
        </div>
    </header>

    <script>
        // Selection of HTML objects
const burger = document.querySelector('.burger i');
const nav = document.querySelector('.nav');

// Defining a function
function toggleNav() {
    burger.classList.toggle('fa-bars');
    burger.classList.toggle('fa-times');
    nav.classList.toggle('nav-active');
}

// Calling the function after click event occurs
burger.addEventListener('click', function() {
    toggleNav();
});     
    </script>
</body>
